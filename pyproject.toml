[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-change-analyzer"
version = "0.1.0"
description = "Grounded, deterministic comparisons of dated regulatory snapshots"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cited-change = "cited_change.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cited_change = ["resources/*.txt"]
