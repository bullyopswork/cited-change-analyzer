[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-change-analyzer"
version = "0.2.0"
description = "Local TXT and PDF comparison with cited changes and optional own-key AI"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.21.1,<7", "psutil>=7,<8"]

[project.scripts]
cited-change = "cited_change.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cited_change = ["resources/*.txt", "web/*", "web/**/*"]
