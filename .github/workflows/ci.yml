name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/freeze_benchmark.py
      - run: python scripts/evaluate.py
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build:package
      - run: python -m pip install .
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/test-local-browser.mjs
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build:package
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error
  clean-install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/verify_install.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel
          path: wheel
      # No Node setup, frontend build, editable install or application checkout.
      - name: Prove downloaded wheel in a clean temporary environment
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('wheel').glob('*.whl'))
          assert len(wheels) == 1, 'Expected exactly one release wheel'
          subprocess.run([sys.executable, 'scripts/verify_install.py',
                          '--artifact', str(wheels[0]), '--report', 'install-proof.json'],
                         check=True, timeout=480)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-proof-${{ matrix.os }}
          path: install-proof.json
          if-no-files-found: warn
